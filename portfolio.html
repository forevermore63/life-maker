<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070708" />
  <title>Life Maker · Portfolio</title>
  <style>
    :root{--bg:#070708;--elevated:#111114;--fg:#f7f7f8;--muted:#a8a8b3;--faint:#6e6e78;--border:rgba(255,255,255,.08);--gold:#e8d5a3;--success:#5ee9a0;--font:"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);padding:1.25rem}
    a{color:var(--gold);text-decoration:none}.wrap{max-width:640px;margin:0 auto}
    h1{font-size:1.4rem;letter-spacing:-.03em;margin:.5rem 0 .25rem}
    p{color:var(--muted);font-size:.9rem}
    .card{border:1px solid var(--border);border-radius:14px;padding:1rem;background:var(--elevated);margin:.6rem 0}
    .row{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
    .name{font-weight:600}.tag{font-size:.75rem;color:var(--faint)}.rev{color:var(--success);font-weight:600;font-variant-numeric:tabular-nums}
    nav a{margin-right:1rem;font-size:.85rem}
  </style>
</head>
<body>
  <div class="wrap">
    <nav><a href="/">Command</a><a href="/vault">Vault</a><a href="/links">Links</a></nav>
    <h1>App portfolio</h1>
    <p>Ten passive income products. Open the vault to transfer pool profits to your bank.</p>
    <div id="list"></div>
  </div>
  <script>
    const apps=[
      ["01","LedgerLite","subscription","Micro-invoices for freelancers",4820],
      ["02","ShelfDigital","digital","Templates and digital goods",6210],
      ["03","LinkGrove","affiliate","Affiliate hubs that convert",2940],
      ["04","PulseLetter","subscription","Newsletter sponsors + tiers",3580],
      ["05","SkillStack","digital","Evergreen mini-courses",5120],
      ["06","YieldPaper","subscription","Dividend compounding paper",2210],
      ["07","PrintAether","marketplace","Print-on-demand storefront",3890],
      ["08","FrameVault","marketplace","Stock asset marketplace",2740],
      ["09","AdNimbus","ads","Ethical content ad units",1960],
      ["10","ApiHive","api","Usage-based micro-APIs",7450],
    ];
    const m=n=>new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0}).format(n);
    document.getElementById("list").innerHTML=apps.map(([i,n,model,t,r])=>
      `<div class="card"><div class="row"><div><div class="name">${i}. ${n}</div><div class="tag">${model} · ${t}</div></div><div class="rev">${m(r)}/mo</div></div></div>`
    ).join("");
  </script>
</body>
</html>
