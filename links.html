<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070708" />
  <title>Life Maker · Inspect Links</title>
  <style>
    :root{--bg:#070708;--elevated:#111114;--fg:#f7f7f8;--muted:#a8a8b3;--faint:#6e6e78;--border:rgba(255,255,255,.08);--gold:#e8d5a3;--font:"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);padding:1.25rem}
    a{color:var(--gold)}.wrap{max-width:640px;margin:0 auto}
    h1{font-size:1.4rem;letter-spacing:-.03em}
    .row{border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;margin:.5rem 0;background:var(--elevated);display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}
    code{font-size:.8rem;color:var(--faint)}
    nav a{margin-right:1rem;font-size:.85rem;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <nav><a href="/">Command</a><a href="/portfolio">Portfolio</a><a href="/vault">Vault</a></nav>
    <h1>Inspect links</h1>
    <p style="color:var(--muted);font-size:.9rem">Masterpiece index — open any path on this deployment.</p>
    <div class="row"><div><strong>Command Center</strong><br><code>/</code></div><a href="/">Open</a></div>
    <div class="row"><div><strong>Bank Vault</strong><br><code>/vault</code></div><a href="/vault">Open</a></div>
    <div class="row"><div><strong>App Portfolio</strong><br><code>/portfolio</code></div><a href="/portfolio">Open</a></div>
    <div class="row"><div><strong>Inspect Links</strong><br><code>/links</code></div><a href="/links">Open</a></div>
  </div>
</body>
</html>
